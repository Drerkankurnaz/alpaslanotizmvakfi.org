

server {
    listen 443 ssl;
    http2 on;
    server_name alpaslanotizmvakfi.org www.alpaslanotizmvakfi.org;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/alpaslanotizmvakfi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpaslanotizmvakfi.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
